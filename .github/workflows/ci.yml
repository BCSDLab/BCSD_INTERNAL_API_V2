name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 통합 테스트는 Testcontainers로 Postgres를 띄운다. GitHub 호스티드 러너에는 Docker가 기본 설치돼 있다.
      - name: Test
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 배포 이미지(Dockerfile + layer 추출)가 실제로 떠서 /health에 응답하는지 확인한다. 테스트 job과 병렬로 돈다.
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar and extract layers
        run: |
          ./gradlew bootJar --console=plain
          java -Djarmode=tools -jar build/libs/bcsd-internal-api-v2-*.jar extract --layers --launcher --destination build/extracted

      - name: Build image
        run: docker build -t bcsd-internal-api:ci .

      - name: Start image and wait for health
        run: |
          docker network create ci
          docker run -d --name ci-postgres --network ci \
            -e POSTGRES_DB=app -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app postgres:16-alpine
          until docker exec ci-postgres pg_isready -U app -d app >/dev/null 2>&1; do sleep 1; done
          docker run -d --name ci-api --network ci --memory=300m \
            -e SERVER_PORT=8081 -e DB_HOST=ci-postgres -e DB_PORT=5432 -e DB_NAME=app \
            -e DB_USERNAME=app -e DB_PASSWORD=app \
            -e JWT_SECRET=ci-only-secret-key-not-for-production-32bytes \
            bcsd-internal-api:ci
          for i in $(seq 1 40); do
            if docker exec ci-api wget -q -O /dev/null http://127.0.0.1:8081/health 2>/dev/null; then
              echo "healthy after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' ci-api
          docker logs --tail 100 ci-api
          exit 1
