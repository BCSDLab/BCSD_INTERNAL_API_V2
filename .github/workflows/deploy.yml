name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # jar는 러너에서 Gradle 캐시로 빌드한다. Docker 안에서 빌드하면 매번 의존성 해석·컴파일을 처음부터 한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar and extract layers
        run: |
          ./gradlew bootJar --console=plain
          java -Djarmode=tools -jar build/libs/bcsd-internal-api-v2-*.jar extract --layers --launcher --destination build/extracted

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/bcsdlab/bcsd-internal-api:latest
            ghcr.io/bcsdlab/bcsd-internal-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/bcsdlab/bcsd-internal-api:latest
            # 기본 10초면 graceful shutdown(요청 20초 + 비동기 메일 20초)이 끝나기 전에 강제 종료된다.
            docker stop -t 45 bcsd-internal-api || true
            docker rm bcsd-internal-api || true
            docker run -d \
              --name bcsd-internal-api \
              --restart unless-stopped \
              --network bcsdlab-internal_default \
              -p 127.0.0.1:8081:8081 \
              -e SERVER_PORT=8081 \
              -e DB_HOST=bcsdlab-internal-postgres \
              -e DB_PORT=5432 \
              -e DB_NAME=bcsdlab_internal \
              -e DB_USERNAME=bcsdlab_internal \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              -e SWAGGER_SERVER_URL='${{ secrets.API_ORIGIN }}' \
              -e RESET_PASSWORD_BASE_URL='${{ secrets.RESET_PASSWORD_BASE_URL }}' \
              -e LOGIN_PAGE_URL='${{ secrets.LOGIN_PAGE_URL }}' \
              -e MAIL_TRANSPORT=ses \
              -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              -e AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}' \
              -e AWS_S3_REGION='${{ secrets.AWS_S3_REGION }}' \
              -e CORS_ALLOWED_ORIGINS='${{ secrets.CORS_ALLOWED_ORIGINS }}' \
              -e GAME_BUILD_UPLOAD_URL='https://bcsdlab.com/api/games/builds/upload' \
              -e GAME_BUILD_SECRET='${{ secrets.GAME_BUILD_SECRET }}' \
              -e GAME_BUILD_PUBLIC_ORIGIN='https://bcsdlab.com' \
              -e SLACK_BOT_TOKEN='${{ secrets.SLACK_BOT_TOKEN }}' \
              -e BBOT_SERVICE_TOKEN='${{ secrets.BBOT_SERVICE_TOKEN }}' \
              --memory=300m \
              ghcr.io/bcsdlab/bcsd-internal-api:latest
            # docker run -d는 컨테이너가 뜨자마자 끝난다. 앱이 실제로 응답할 때까지 기다리고, 못 뜨면 배포를 실패로 남긴다.
            for i in $(seq 1 40); do
              if docker exec bcsd-internal-api wget -q -O /dev/null http://127.0.0.1:8081/health 2>/dev/null; then
                echo "healthy after $((i * 3))s"
                exit 0
              fi
              sleep 3
            done
            # 공개 레포라 Actions 로그가 공개된다. 앱 로그 대신 컨테이너 상태만 남기고, 원인은 서버에서 docker logs로 본다.
            echo "health check failed"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' bcsd-internal-api
            exit 1
