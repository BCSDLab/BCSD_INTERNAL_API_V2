spring:
  application:
    name: BcsdInternalApiV2

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bcsd_internal_api_v2}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # 운영 로그에 모든 SQL이 찍히지 않게 기본은 끈다. 로컬에서 보려면 JPA_SHOW_SQL=true.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # 지연 로딩 연관(회원의 직책·트랙 등)을 목록 크기만큼 한 번에 읽는다(N+1 방지).
        default_batch_fetch_size: 100
    open-in-view: false

  # 배포는 컨테이너를 내렸다 올린다. 처리 중인 요청과 큐에 남은 비동기 메일(@Async)을 마치고 종료한다.
  # deploy.yml의 docker stop 대기 시간은 이 두 단계의 합보다 길어야 한다.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 20s

  flyway:
    enabled: true
    locations: classpath:db/migration

  # multipart를 받는 API는 장부 거래내역 가져오기뿐이다(실제 파일 최대 27KB). 넘으면 413.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}
  # 컨테이너 메모리 한도(300MiB)에서 기본값 200은 과하다. 내부 서비스라 동시 요청이 적다.
  tomcat:
    threads:
      max: 50

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 1800
    setup-token-validity-seconds: 900
  refresh-token:
    cookie-name: refreshToken
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    default-validity-days: 1
    remember-me-validity-days: 30
  reset-password:
    base-url: ${RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}
  login-page:
    url: ${LOGIN_PAGE_URL:http://localhost:3000/login}
  mail:
    transport: ${MAIL_TRANSPORT:sendmail}
    from: ${MAIL_FROM:no-reply@bcsdlab.com}
    ses-region: ${AWS_SES_REGION:us-west-2}
  s3:
    region: ${AWS_S3_REGION:us-west-2}
    bucket: ${AWS_S3_BUCKET:bcsd-internal}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://image.bcsdlab.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  game-build:
    upload-url: ${GAME_BUILD_UPLOAD_URL:http://localhost:3003/api/games/builds/upload}
    secret: ${GAME_BUILD_SECRET:}
    token-validity-seconds: 1800
    public-origin: ${GAME_BUILD_PUBLIC_ORIGIN:https://bcsdlab.com}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
  service:
    bbot-token: ${BBOT_SERVICE_TOKEN:}
