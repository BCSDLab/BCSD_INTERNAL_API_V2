spring:
  application:
    name: BcsdInternalApiV2

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bcsd_internal_api_v2}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 1800
    setup-token-validity-seconds: 900
  refresh-token:
    cookie-name: refreshToken
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    default-validity-days: 1
    remember-me-validity-days: 30
  reset-password:
    base-url: ${RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}
  login-page:
    url: ${LOGIN_PAGE_URL:http://localhost:3000/login}
  mail:
    transport: ${MAIL_TRANSPORT:sendmail}
    from: ${MAIL_FROM:no-reply@bcsdlab.com}
    ses-region: ${AWS_SES_REGION:us-west-2}
  s3:
    region: ${AWS_S3_REGION:us-west-2}
    bucket: ${AWS_S3_BUCKET:bcsd-internal}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://image.bcsdlab.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  homepage-revalidate:
    url: ${HOMEPAGE_REVALIDATE_URL:http://localhost:3003/api/revalidate}
    secret: ${HOMEPAGE_REVALIDATE_SECRET:local-dev-secret}
  game-build:
    upload-url: ${GAME_BUILD_UPLOAD_URL:http://localhost:3003/api/games/builds/upload}
    secret: ${GAME_BUILD_SECRET:local-dev-secret}
    token-validity-seconds: 1800
